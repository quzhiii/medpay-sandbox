# 北京市 DRG 2.0 示例包
# param_source: assumption - 用于演示目的，不可用于真实结算

id: beijing_drg_demo
name: 北京市 DRG 2.0 示例
region_level: 城市
payment_primary: DRG
policy_version: CHS-DRG 2.0
settlement_cycle: daily_demo

budget_model:
  annual_budget: 50000000000  # 500亿（假设值）
  description: 年度医保基金预算（演示用）

drg:
  base_rate: 20000  # 基础费率 2万元
  adjustment_multiplier: 1.0  # 调节系数
  outlier_multiplier: 3.0  # 极高费用阈值 = 标准费用 × 3

dip:
  point_value_model:
    multiplier: 1.0  # 本院点数权重
    external_points_base: 1000000  # 区域外点数基数（演示用）

special_case:
  quota_rate_drg: 0.05  # DRG 特例单议额度 ≤5%
  quota_rate_dip: 0.005  # DIP 特例单议额度 ≤0.5%
  uplift_rate: 1.3  # 特例单议上浮 30%
  ffspay_rate: 0.85  # 按项目付费比例 85%

param_source_map:
  base_rate: assumption
  adjustment_multiplier: assumption
  outlier_multiplier: official
  quota_rate_drg: official
  quota_rate_dip: official
  uplift_rate: assumption
  ffspay_rate: assumption
  budget_model: assumption
  point_value_model: assumption
  multiplier: assumption
  external_points_base: assumption
  annual_budget: assumption

evidence:
  - param_key: outlier_multiplier
    source_type: official
    source_title: 国家医保局关于印发DRG/DIP支付方式改革三年行动计划的通知
    source_url: null  # 待补充真实链接
    publish_date: "2021-11-26"
    excerpt: 极高费用病例按实际费用的一定比例结算，阈值通常为标准费用的3倍
    notes: 具体阈值各统筹区可调整，此处采用国家指导值

  - param_key: quota_rate_drg
    source_type: official
    source_title: CHS-DRG 2.0 技术规范
    source_url: null
    publish_date: "2023-06-01"
    excerpt: 特例单议病例数量原则上不超过出院病例总数的5%
    notes: 各地可根据实际情况适当调整

  - param_key: quota_rate_dip
    source_type: official
    source_title: DIP 2.0 技术规范
    source_url: null
    publish_date: "2023-06-01"
    excerpt: 特例单议病例数量原则上不超过出院病例总数的5‰
    notes: DIP模式下特例单议比例更严格

  - param_key: base_rate
    source_type: assumption
    source_title: 演示假设值
    source_url: null
    publish_date: null
    excerpt: 基础费率设为20000元，用于演示计算，不代表任何统筹区真实费率
    notes: "param_source=assumption，不可用于真实结算"

  - param_key: budget_model
    source_type: assumption
    source_title: 演示假设值
    source_url: null
    publish_date: null
    excerpt: 年度预算设为500亿元，仅用于演示点值计算逻辑
    notes: "param_source=assumption，不可用于真实结算"

  - param_key: point_value_model
    source_type: assumption
    source_title: 演示假设值
    source_url: null
    publish_date: null
    excerpt: DIP点值分母假设，用于演示囚徒困境机制
    notes: "param_source=assumption，实际点值由区域总分值决定"

  - param_key: adjustment_multiplier
    source_type: assumption
    source_title: 演示假设值
    source_url: null
    publish_date: null
    excerpt: 调节系数暂设为1.0，用于演示标准化支付计算
    notes: "param_source=assumption，待补齐官方链接"

  - param_key: uplift_rate
    source_type: assumption
    source_title: 演示假设值
    source_url: null
    publish_date: null
    excerpt: 特例单议上浮比例暂设为30%，用于演示管理效应
    notes: "param_source=assumption，待补齐官方链接"

  - param_key: ffspay_rate
    source_type: assumption
    source_title: 演示假设值
    source_url: null
    publish_date: null
    excerpt: 按项目付费比例暂设为85%，用于演示替代策略
    notes: "param_source=assumption，待补齐官方链接"

  - param_key: multiplier
    source_type: assumption
    source_title: 演示假设值
    source_url: null
    publish_date: null
    excerpt: 本院点数乘数暂设为1.0，便于对比点值变化
    notes: "param_source=assumption，待补齐官方链接"

  - param_key: external_points_base
    source_type: assumption
    source_title: 演示假设值
    source_url: null
    publish_date: null
    excerpt: 区域外点数基数设为100万，用于模拟区域分母
    notes: "param_source=assumption，待补齐官方链接"

  - param_key: annual_budget
    source_type: assumption
    source_title: 演示假设值
    source_url: null
    publish_date: null
    excerpt: 年度预算500亿元为演示设定，非真实政策值
    notes: "param_source=assumption，待补齐官方链接"
